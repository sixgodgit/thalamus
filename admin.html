<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thalamus Admin</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0d1117;color:#c9d1d9;min-height:100vh}
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;background:radial-gradient(ellipse at 50% 0%,#1a2332 0%,#0d1117 70%)}
.login-box{text-align:center;width:100%;max-width:380px}
.login-box h1{font-size:32px;margin-bottom:4px;background:linear-gradient(135deg,#58a6ff,#3fb950);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.login-box .sub{color:#8b949e;font-size:14px;margin-bottom:28px}
.login-card{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:28px;text-align:left}
.login-card label{font-size:12px;color:#8b949e;font-weight:600;display:block;margin-bottom:6px}
.login-card input{width:100%;padding:10px 14px;background:#0d1117;border:1px solid #30363d;border-radius:8px;color:#c9d1d9;font-size:14px;outline:none;transition:border .2s;box-sizing:border-box}
.login-card input:focus{border-color:#58a6ff}
.login-card .btn{width:100%;margin-top:16px;padding:10px;background:#238636;border:none;border-radius:8px;color:#fff;font-size:14px;font-weight:600;cursor:pointer;transition:background .2s}
.login-card .btn:hover{background:#2ea043}
.login-card .err{color:#f85149;font-size:13px;margin-top:10px;display:none;text-align:center}
input,select,textarea{width:100%;padding:8px 12px;background:#0d1117;border:1px solid #30363d;border-radius:6px;color:#c9d1d9;font-size:13px;outline:none;box-sizing:border-box}
input:focus,select:focus,textarea:focus{border-color:#58a6ff}
select option{background:#161b22}
.btn{display:inline-flex;align-items:center;gap:4px;padding:7px 14px;background:#238636;border:none;border-radius:6px;color:#fff;font-size:12px;font-weight:600;cursor:pointer;transition:background .2s;white-space:nowrap}
.btn:hover{background:#2ea043}
.btn-o{background:transparent;border:1px solid #30363d;color:#c9d1d9}
.btn-o:hover{background:#21262d}
.btn-r{background:#da3633}
.btn-r:hover{background:#f85149}
.btn-s{padding:5px 10px;font-size:11px}
.app-top{background:#161b22;border-bottom:1px solid #30363d;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.app-top h1{font-size:16px;color:#f0f6fc;display:flex;align-items:center;gap:6px}
.app-top .ver{color:#8b949e;font-size:11px;font-weight:400}
.app-acts{display:flex;gap:4px}
.wrap{max-width:1200px;margin:0 auto;padding:16px 20px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.stat{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:14px;text-align:center}
.stat .n{font-size:24px;font-weight:700;color:#f0f6fc}
.stat .l{font-size:11px;color:#8b949e;margin-top:2px}
.section{background:#161b22;border:1px solid #30363d;border-radius:8px;margin-bottom:14px;overflow:visible}
.s-h{padding:12px 16px;border-bottom:1px solid #21262d;display:flex;justify-content:space-between;align-items:center}
.s-h h2{font-size:14px;font-weight:600}
.s-b{padding:0}
.tbl{width:100%;border-collapse:collapse}
.tbl th{background:#0d1117;padding:8px 12px;text-align:left;color:#8b949e;font-weight:600;font-size:10px;text-transform:uppercase;border-bottom:1px solid #21262d;white-space:nowrap}
.tbl td{padding:8px 12px;border-bottom:1px solid #21262d;font-size:12px;vertical-align:middle}
.tbl tr:hover td{background:#1c2128}
.tbl tr:last-child td{border-bottom:none}
.b{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600;white-space:nowrap}
.b-k{background:#1f6feb22;color:#58a6ff}
.b-t{background:#da363322;color:#f85149}
.b-s{background:#23863622;color:#3fb950}
.b-d{background:#8b949e22;color:#8b949e}
.m{font-family:monospace;font-size:11px;color:#f0f6fc}
.e{font-family:monospace;font-size:10px;color:#8b949e;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.k{font-family:monospace;font-size:10px;color:#8b949e}
.pv{display:inline-flex;align-items:center;gap:2px;padding:1px 6px;background:#21262d;border-radius:10px;font-size:10px;color:#8b949e}
.em{text-align:center;padding:30px;color:#8b949e;font-size:12px}
.fg{margin-bottom:12px}
.fg label{display:block;font-size:11px;color:#8b949e;margin-bottom:3px;font-weight:600}
.fg .h{font-size:10px;color:#6e7681;margin-top:2px}
.fg textarea{font-family:monospace;min-height:44px;resize:vertical;font-size:11px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pg{display:flex;gap:6px;flex-wrap:wrap}
.pg input[type=radio]{display:none}
.pg label{padding:6px 14px;background:#0d1117;border:1px solid #30363d;border-radius:6px;cursor:pointer;font-size:12px;transition:all .2s;text-align:center}
.pg label:hover{border-color:#8b949e}
.pg input[type=radio]:checked+label{border-color:#58a6ff;background:#1f6feb22;color:#58a6ff}
.mo{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);z-index:1000;align-items:center;justify-content:center}
.mo.on{display:flex}
.mw{background:#161b22;border:1px solid #30363d;border-radius:10px;width:100%;max-width:600px;max-height:90vh;overflow-y:auto}
.mh{padding:14px 18px;border-bottom:1px solid #21262d;display:flex;justify-content:space-between;align-items:center}
.mh h3{font-size:15px;font-weight:600}
.mc{padding:18px}
.mf{padding:10px 18px;border-top:1px solid #21262d;display:flex;justify-content:flex-end;gap:6px}
.toast{position:fixed;bottom:20px;right:20px;background:#238636;color:#fff;padding:10px 16px;border-radius:6px;font-size:12px;z-index:2000;display:none}
.toast.e{background:#da3633}
.cfg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;padding:14px}
.cfg h3{font-size:12px;margin-bottom:8px}
@media(max-width:768px){.stats{grid-template-columns:1fr 1fr}.cfg{grid-template-columns:1fr}.fr{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="loginScreen" class="login-wrap">
  <div class="login-box">
    <h1>✦ Thalamus</h1>
    <div class="sub">模型调度中枢 · 管理面板</div>
    <div class="login-card">
      <label>管理密码</label>
      <input type="password" id="loginPwd" placeholder="输入密码" onkeydown="if(event.key==='Enter')doLogin()" autofocus>
      <button class="btn" onclick="doLogin()">登录</button>
      <div class="err" id="loginError">密码错误，请重试</div>
    </div>
  </div>
</div>

<div id="app" style="display:none">
  <div class="app-top">
    <h1>✦ Thalamus <span class="ver" id="vBadge">v4.0.0</span></h1>
    <div class="app-acts">
      <button class="btn btn-o btn-s" onclick="fetchAll()">🔄 刷新</button>
      <button class="btn btn-o btn-s" onclick="doReload()">⚡ 重载</button>
      <button class="btn btn-r btn-s" onclick="doLogout()">退出</button>
    </div>
  </div>
  <div class="wrap">
    <div class="stats" id="statsBox"></div>
    <div class="stats" id="balanceBox" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr));margin-bottom:16px"></div>
    <div class="section">
      <div class="s-h"><h2>🛣️ 路由规则</h2><button class="btn btn-s" onclick="openRoute(-1)">+ 新建</button></div>
      <div class="s-b" id="routesBox"></div>
    </div>
    <div class="section">
      <div class="s-h"><h2>🔑 API 密钥</h2><button class="btn btn-s" onclick="openKey()">+ 添加</button></div>
      <div class="s-b" id="keysBox"></div>
    </div>
    <div class="section">
      <div class="s-h"><h2>⚙️ 系统配置</h2></div>
      <div class="s-b" id="cfgBox"></div>
    </div>
    <div class="section">
      <div class="s-h"><h2>📋 运行日志</h2></div>
      <div class="s-b" style="padding:0" id="logsBox"></div>
    </div>
  </div>
</div>

<div class="mo" id="rtModal">
  <div class="mw">
    <div class="mh"><h3 id="rtTitle">新建路由</h3><button class="btn btn-o btn-s" onclick="closeModal('rtModal')">✕</button></div>
    <div class="mc">
      <div class="fg"><label>路由名称</label><input id="rtLabel" placeholder="如: MiMo 2.5 Pro"></div>
      <div class="fg">
        <label>用途</label>
        <div class="pg" id="purposeGroup" onchange="onPurposeChange(event)">
          <input type="radio" name="p" id="pc" value="code"><label for="pc">💻 代码/运维</label>
          <input type="radio" name="p" id="pr" value="reasoning"><label for="pr">🧠 推理/分析</label>
          <input type="radio" name="p" id="pv" value="vision"><label for="pv">👁️ 图片/视觉</label>
          <input type="radio" name="p" id="pd" value="default"><label for="pd">💬 日常</label>
        </div>
        <div class="h">选择用途后自动填充匹配关键词</div>
      </div>
      <div class="fg"><label>匹配关键词（正则）</label><textarea id="rtPattern" rows="2" placeholder="如: (代码|编程|修.*bug|部署)"></textarea><div class="h">用户消息含这些关键词时路由到此模型</div></div>
      <div class="fr">
        <div class="fg"><label>模型 ID</label><input id="rtModel" placeholder="mimo-v2.5-pro"><div class="h">API 请求中的 model 参数</div></div>
        <div class="fg"><label>Provider</label><input id="rtProv" placeholder="xiaomi"><div class="h">标识，如 xiaomi / deepseek</div></div>
      </div>
      <div class="fg"><label>API 端点</label><input id="rtEp" placeholder="https://token-plan-cn.xiaomimimo.com/v1/chat/completions"><div class="h">完整 URL，含 /v1/chat/completions</div></div>
      <div class="fg"><label>API 密钥</label><select id="rtKey"></select><div class="h">先在「API 密钥」区添加</div></div>
      <input type="hidden" id="rtIdx" value="-1">
    </div>
    <div class="mf">
      <button class="btn btn-r btn-s" id="rtDelBtn" style="margin-right:auto;display:none" onclick="delRoute()">🗑️ 删除</button>
      <button class="btn btn-o btn-s" onclick="closeModal('rtModal')">取消</button>
      <button class="btn btn-s" onclick="saveRoute()">✅ 保存</button>
    </div>
  </div>
</div>

<div class="mo" id="keyModal">
  <div class="mw" style="max-width:420px">
    <div class="mh"><h3>添加 API 密钥</h3><button class="btn btn-o btn-s" onclick="closeModal('keyModal')">✕</button></div>
    <div class="mc">
      <div class="fg"><label>密钥名称</label><input id="keyName" placeholder="如: MY_OPENAI_KEY"></div>
      <div class="fg"><label>API 密钥</label><input id="keyVal" type="password" placeholder="sk-... 或 cfk_..."><div class="h">保存后不可查看，仅显示脱敏版本</div></div>
    </div>
    <div class="mf">
      <button class="btn btn-o btn-s" onclick="closeModal('keyModal')">取消</button>
      <button class="btn btn-s" onclick="saveKey()">✅ 保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var token = localStorage.getItem('tk') || '';
var cfg = null;
var st = null;

var PP = {
  code: '(代码|编程|写.*程序|修.*bug|修复|重构|部署|deploy|运维|nginx|docker|ssh|git|测试|debug|error|exception|配置|cron)',
  reasoning: '(分析|对比|比较|推理|为什么|原因|根因|评估|策略|方案|审查|review|决策|架构)',
  vision: '(图片|截图|照片|图像|看图|OCR|识别|vision|视觉|多媒体)',
  default: ''
};

function doLogin() {
  var p = document.getElementById('loginPwd').value;
  if (!p) return;
  api('POST', '/admin/api/login', {password: p}).then(function(d) {
    token = d.token;
    localStorage.setItem('tk', token);
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    fetchAll();
  }).catch(function() {
    document.getElementById('loginError').style.display = 'block';
  });
}

function doLogout() {
  token = '';
  localStorage.removeItem('tk');
  document.getElementById('app').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('loginPwd').value = '';
}

function api(m, p, b) {
  var opts = {method: m, headers: {'Content-Type': 'application/json'}};
  if (token) opts.headers['Authorization'] = 'Bearer ' + token;
  if (b) opts.body = JSON.stringify(b);
  return fetch(p, opts).then(function(r) {
    return r.json().then(function(d) {
      if (!r.ok) throw new Error(d.error || 'fail');
      return d;
    });
  });
}

function toast(msg, err) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast' + (err ? ' e' : '');
  el.style.display = 'block';
  setTimeout(function() { el.style.display = 'none'; }, 3000);
}

function mask(k) {
  if (!k || k.length < 8) return '****';
  return k.slice(0,4) + '****' + k.slice(-4);
}

function detectPurpose(label, model, prov, pattern) {
  var t = (label||'') + ' ' + (model||'') + ' ' + (prov||'') + ' ' + (pattern||'');
  // 按优先级判断：OpenRouter 强信号 > 视觉 > 代码关键词
  if (/OpenRouter/.test(t)) return 'reasoning';
  if (/Omni|vision|视觉|图片|OCR|截图/.test(t)) return 'vision';
  if (/MiMo.*2\.5|xiao.*code|^代码|编程|部署|运维|docker|nginx|ssh|bug|重构|测试/.test(t)) return 'code';
  if (/analy|reason|推理|分析|对比|评估|策略/.test(t)) return 'reasoning';
  return 'default';
}

var PURPOSE_LABEL = {code:'代码/运维',reasoning:'推理/分析',vision:'图片/视觉',default:'日常对话'};
var PURPOSE_CLASS = {code:'b b-k',reasoning:'b b-t',vision:'b b-s',default:'b b-d'};

function fetchAll() {
  Promise.all([
    api('GET', '/admin/api/config'),
    api('GET', '/admin/api/stats'),
    api('GET', '/admin/api/logs'),
    api('GET', '/admin/api/balances')
  ]).then(function(r) {
    cfg = r[0]; st = r[1];
    render();
    renderLogs(r[2]);
    renderBalances(r[3]);
  }).catch(function(e) {
    if ((e.message||'').indexOf('401') >= 0) doLogout();
    else toast(e.message, true);
  });
}

function render() {
  if (!cfg) return;
  document.getElementById('vBadge').textContent = 'v' + (cfg.version || '4.0.0');

  // stats
  var s = st || {};
  var up = s.uptime_seconds || 0;
  var upStr = up > 86400 ? Math.floor(up/86400)+'d '+(Math.floor((up%86400)/3600))+'h' : Math.floor(up/3600)+'h '+(Math.floor((up%3600)/60))+'m';
  document.getElementById('statsBox').innerHTML = 
    '<div class="stat"><div class="n">'+(s.calls||0)+'</div><div class="l">总调用</div></div>' +
    '<div class="stat"><div class="n">'+upStr+'</div><div class="l">运行时长</div></div>' +
    '<div class="stat"><div class="n">'+(s.by_provider?Object.keys(s.by_provider).length:0)+'</div><div class="l">活跃 Provider</div></div>' +
    '<div class="stat"><div class="n" style="color:'+((s.fallbacks||0)>0?'#d29922':'#3fb950')+'">'+(s.fallbacks||0)+'</div><div class="l">Fallback</div></div>';

  // routes
  var routes = cfg.routes || [];
  var rHtml = '';
  if (routes.length) {
    rHtml = '<table class="tbl"><thead><tr><th>用途</th><th>名称</th><th>模型</th><th>Provider</th><th>端点</th><th>密钥</th><th style="text-align:center">操作</th></tr></thead><tbody>';
    for (var i = 0; i < routes.length; i++) {
      var r = routes[i];
      var rawPat = r.pattern ? (r.pattern.source || r.pattern) : '';
      var p = detectPurpose(r.label, r.model, r.provider, rawPat);
      rHtml += '<tr>' +
        '<td><span class="'+PURPOSE_CLASS[p]+'">'+PURPOSE_LABEL[p]+'</span></td>' +
        '<td style="font-weight:500">'+esc(r.label||'N/A')+'</td>' +
        '<td class="m">'+esc(r.model||'N/A')+'</td>' +
        '<td><span class="pv">'+esc(r.provider||'N/A')+'</span></td>' +
        '<td class="e" title="'+esc(r.endpoint||'')+'">'+esc(r.endpoint||'N/A')+'</td>' +
        '<td class="k">'+esc(r.key_env||'N/A')+'</td>' +
        '<td style="text-align:center"><button class="btn btn-o btn-s" onclick="openRoute('+i+')">编辑</button></td>' +
        '</tr>';
    }
    rHtml += '</tbody></table>';
  } else {
    rHtml = '<div class="em">暂无路由规则</div>';
  }
  document.getElementById('routesBox').innerHTML = rHtml;

  // keys
  keys = cfg.keys || {};
  var ke = Object.keys(keys);
  var kHtml = '';
  if (ke.length) {
    kHtml = '<table class="tbl"><thead><tr><th>名称</th><th>密钥值</th><th style="text-align:center">操作</th></tr></thead><tbody>';
    for (var i = 0; i < ke.length; i++) {
      var n = ke[i];
      kHtml += '<tr><td style="font-weight:500;font-family:monospace">'+esc(n)+'</td><td class="k">'+mask(keys[n])+'</td><td style="text-align:center"><button class="btn btn-r btn-s" onclick="delKey(\''+esc(n)+'\')">删除</button></td></tr>';
    }
    kHtml += '</tbody></table>';
  } else {
    var envNames = cfg.env_keys ? Object.keys(cfg.env_keys) : [];
    kHtml = '<div class="em">暂无自定义密钥。系统密钥：' + envNames.map(function(k) { return '<code style="font-size:11px">'+k+'</code>'; }).join(', ') + '</div>';
  }
  document.getElementById('keysBox').innerHTML = kHtml;

  // config
  var df = cfg.default || {};
  var fb = cfg.fallback || {};
  var pc = cfg.precheck || {};
  document.getElementById('cfgBox').innerHTML =
    '<div class="cfg">' +
    '  <div><h3 style="color:#58a6ff">🔵 默认路由</h3>' +
    '    <div class="fg"><label>模型</label><input id="cdm" value="'+esc(df.model||'')+'"></div>' +
    '    <div class="fg"><label>Provider</label><input id="cdp" value="'+esc(df.provider||'')+'"></div>' +
    '    <div class="fg"><label>端点</label><input id="cde" value="'+esc(df.endpoint||'')+'"></div>' +
    '    <div class="fg"><label>密钥</label><input id="cdk" value="'+esc(df.key_env||'')+'"></div>' +
    '  </div>' +
    '  <div><h3 style="color:#d29922">🟡 Fallback</h3>' +
    '    <div class="fg"><label>模型</label><input id="cfm" value="'+esc(fb.model||'')+'"></div>' +
    '    <div class="fg"><label>Provider</label><input id="cfp" value="'+esc(fb.provider||'')+'"></div>' +
    '    <div class="fg"><label>端点</label><input id="cfe" value="'+esc(fb.endpoint||'')+'"></div>' +
    '    <div class="fg"><label>密钥</label><input id="cfk" value="'+esc(fb.key_env||'')+'"></div>' +
    '  </div>' +
    '  <div><h3 style="color:#3fb950">🟢 Pre-check</h3>' +
    '    <div class="fg"><label>启用</label><select id="cpe"><option value="true"'+(pc.enabled===true?' selected':'')+'>开启</option><option value="false"'+(pc.enabled===false?' selected':'')+'>关闭</option></select></div>' +
    '    <div class="fg"><label>模型</label><input id="cpm" value="'+esc(pc.model||'')+'"></div>' +
    '    <div class="fg"><label>Provider</label><input id="cpp" value="'+esc(pc.provider||'')+'"></div>' +
    '    <div class="fg"><label>端点</label><input id="cpep" value="'+esc(pc.endpoint||'')+'"></div>' +
    '  </div>' +
    '</div>' +
    '<div style="padding:10px 16px;border-top:1px solid #21262d;text-align:right"><button class="btn btn-s" onclick="saveCfg()">💾 保存</button></div>';
}

function renderLogs(data) {
  if (!data) return;
  var lines = data.lines || [];
  var total = data.total || 0;
  var h = '';
  if (lines.length) {
    h = '<div style="background:#0d1117;padding:10px 14px;font-family:monospace;font-size:10px;line-height:1.6;max-height:400px;overflow-y:auto;color:#8b949e">';
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i].replace(/</g,'&lt;').replace(/>/g,'&gt;');
      var cls = '';
      if (line.indexOf('ERROR') >= 0 || line.indexOf('FATAL') >= 0) cls = ' style="color:#f85149"';
      else if (line.indexOf('FALLBACK') >= 0) cls = ' style="color:#d29922"';
      else if (line.indexOf('ROUTE') >= 0) cls = ' style="color:#58a6ff"';
      else if (line.indexOf('CALL') >= 0) cls = ' style="color:#3fb950"';
      else if (line.indexOf('STREAM') >= 0) cls = ' style="color:#3fb950"';
      h += '<div'+cls+'>'+line+'</div>';
    }
    h += '</div>';
    h += '<div style="padding:6px 14px;font-size:10px;color:#6e7681;border-top:1px solid #21262d">共 ' + total + ' 条，显示最近 ' + lines.length + ' 条</div>';
  } else {
    h = '<div class="em">暂无日志</div>';
  }
  document.getElementById('logsBox').innerHTML = h;
}

function renderBalances(data) {
  if (!data) return;
  var h = '';
  // DeepSeek
  if (data.deepseek && data.deepseek.balance_infos) {
    var bi = data.deepseek.balance_infos[0] || {};
    var bal = parseFloat(bi.total_balance || 0);
    h += '<div class="stat"><div class="n" style="font-size:20px">¥' + bal.toFixed(2) + '</div><div class="l">DeepSeek 余额</div></div>';
  } else if (data.deepseek && data.deepseek.error) {
    h += '<div class="stat"><div class="n" style="font-size:14px;color:#f85149">?</div><div class="l">DeepSeek 余额</div></div>';
  }
  // OpenRouter
  if (data.openrouter && data.openrouter.limit_remaining !== undefined) {
    var remain = data.openrouter.limit_remaining;
    var limit = data.openrouter.limit || 0;
    h += '<div class="stat"><div class="n" style="font-size:20px">$' + remain.toFixed(2) + '</div><div class="l">OpenRouter 剩余/$' + limit.toFixed(0) + '</div></div>';
    var daily = data.openrouter.usage_daily || 0;
    h += '<div class="stat"><div class="n" style="font-size:18px">$' + daily.toFixed(3) + '</div><div class="l">今日用量</div></div>';
  } else if (data.openrouter && data.openrouter.error) {
    h += '<div class="stat"><div class="n" style="font-size:14px;color:#f85149">?</div><div class="l">OpenRouter</div></div>';
  }
  document.getElementById('balanceBox').innerHTML = h || '<div class="stat"><div class="n" style="font-size:14px;color:#6e7681">—</div><div class="l">余额信息</div></div>';
}

function esc(s) {
  if (typeof s !== 'string') return s;
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// Route modal
function openRoute(idx) {
  document.getElementById('rtTitle').textContent = idx >= 0 ? '编辑路由' : '新建路由';
  document.getElementById('rtIdx').value = idx;
  document.getElementById('rtDelBtn').style.display = idx >= 0 ? 'inline-flex' : 'none';

  var sel = document.getElementById('rtKey');
  var keyOpts = '<option value="">-- 选择 --</option>';
  var k = cfg.keys || {};
  for (var n in k) {
    if (k.hasOwnProperty(n)) keyOpts += '<option value="keys:'+n+'">🔑 '+n+'</option>';
  }
  var ek = cfg.env_keys || {};
  for (var n in ek) {
    if (ek.hasOwnProperty(n)) keyOpts += '<option value="'+n+'">⚙️ '+n+'</option>';
  }
  sel.innerHTML = keyOpts;

  if (idx >= 0 && cfg.routes && cfg.routes[idx]) {
    var r = cfg.routes[idx];
    document.getElementById('rtLabel').value = r.label || '';
    var pat = r.pattern ? (r.pattern.source || r.pattern) : '';
    document.getElementById('rtPattern').value = pat;
    document.getElementById('rtModel').value = r.model || '';
    document.getElementById('rtProv').value = r.provider || '';
    document.getElementById('rtEp').value = r.endpoint || '';
    sel.value = r.key_env || '';

    var p = detectPurpose(r.label, r.model, r.provider, pat);
    var radio = document.querySelector('input[name="p"][value="'+p+'"]');
    if (radio) radio.checked = true;
  } else {
    document.getElementById('rtLabel').value = '';
    document.getElementById('rtPattern').value = '';
    document.getElementById('rtModel').value = '';
    document.getElementById('rtProv').value = '';
    document.getElementById('rtEp').value = '';
    sel.value = '';
    document.getElementById('pc').checked = true;
  }
  document.getElementById('rtModal').classList.add('on');
}

function onPurposeChange(e) {
  var val = e.target.value;
  var pat = PP[val] || '';
  if (pat && !document.getElementById('rtPattern').value) {
    document.getElementById('rtPattern').value = pat;
  }
}

function saveRoute() {
  var idx = parseInt(document.getElementById('rtIdx').value);
  var route = {
    label: document.getElementById('rtLabel').value.trim(),
    pattern: document.getElementById('rtPattern').value.trim(),
    model: document.getElementById('rtModel').value.trim(),
    provider: document.getElementById('rtProv').value.trim(),
    endpoint: document.getElementById('rtEp').value.trim(),
    key_env: document.getElementById('rtKey').value
  };
  if (!route.label) { toast('请填写路由名称', true); return; }
  if (!route.pattern) { toast('请填写匹配关键词', true); return; }
  if (!route.model || !route.endpoint) { toast('请填写模型 ID 和端点', true); return; }
  var body = {action: 'upsert_route', route: route};
  if (idx >= 0) body.index = idx;
  api('POST', '/admin/api/config', body).then(function() {
    closeModal('rtModal');
    return fetchAll();
  }).then(function() {
    toast('✅ 已保存');
  }).catch(function(e) { toast(e.message, true); });
}

function delRoute() {
  var idx = parseInt(document.getElementById('rtIdx').value);
  if (!confirm('确认删除此路由规则？')) return;
  api('POST', '/admin/api/config', {action: 'delete_route', index: idx}).then(function() {
    closeModal('rtModal');
    return fetchAll();
  }).then(function() { toast('已删除'); }).catch(function(e) { toast(e.message, true); });
}

// Keys
function openKey() { document.getElementById('keyModal').classList.add('on'); }

function saveKey() {
  var name = document.getElementById('keyName').value.trim();
  var val = document.getElementById('keyVal').value.trim();
  if (!name) { toast('请填写密钥名称', true); return; }
  if (!val) { toast('请填写 API 密钥', true); return; }
  api('POST', '/admin/api/config', {action: 'upsert_key', key_name: name, key_value: val}).then(function() {
    closeModal('keyModal');
    document.getElementById('keyName').value = '';
    document.getElementById('keyVal').value = '';
    return fetchAll();
  }).then(function() { toast('✅ 已保存'); }).catch(function(e) { toast(e.message, true); });
}

function delKey(name) {
  if (!confirm('确认删除密钥 "'+name+'"？不可恢复。')) return;
  api('POST', '/admin/api/config', {action: 'delete_key', key_name: name}).then(function() {
    return fetchAll();
  }).then(function() { toast('已删除'); }).catch(function(e) { toast(e.message, true); });
}

function saveCfg() {
  api('POST', '/admin/api/config', {
    action: 'update_defaults',
    default: {
      model: document.getElementById('cdm').value.trim(),
      provider: document.getElementById('cdp').value.trim(),
      endpoint: document.getElementById('cde').value.trim(),
      key_env: document.getElementById('cdk').value.trim()
    },
    fallback: {
      model: document.getElementById('cfm').value.trim(),
      provider: document.getElementById('cfp').value.trim(),
      endpoint: document.getElementById('cfe').value.trim(),
      key_env: document.getElementById('cfk').value.trim()
    },
    precheck: {
      enabled: document.getElementById('cpe').value === 'true',
      model: document.getElementById('cpm').value.trim(),
      provider: document.getElementById('cpp').value.trim(),
      endpoint: document.getElementById('cpep').value.trim()
    }
  }).then(function() {
    return fetchAll();
  }).then(function() { toast('✅ 已保存'); }).catch(function(e) { toast(e.message, true); });
}

function doReload() {
  api('POST', '/admin/api/reload').then(function() {
    return fetchAll();
  }).then(function() { toast('⚡ 已重载'); }).catch(function(e) { toast(e.message, true); });
}

function closeModal(id) {
  document.getElementById(id).classList.remove('on');
}

// Auto login
if (token) {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  fetchAll();
}
</script>
</body>
</html>
