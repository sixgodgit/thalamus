<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Thalamus · 模型控制台</title>
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Thalamus 控制台" />
<meta name="theme-color" content="#000000" />
<style>
:root{
  --bg:#000000;
  --surface:#1c1c1e;
  --surface-2:#2c2c2e;
  --separator:rgba(84,84,88,0.65);
  --label:#ffffff;
  --label-2:rgba(235,235,245,0.6);
  --label-3:rgba(235,235,245,0.3);
  --accent:#0a84ff;
  --green:#30d158;
  --red:#ff453a;
  --orange:#ff9f0a;
  --radius-lg:20px;
  --radius-md:12px;
  --radius-sm:8px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--label);min-height:100vh;
  padding:calc(16px + var(--safe-top)) 16px calc(24px + var(--safe-bottom));
  line-height:1.4;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;
}
.wrap{max-width:460px;margin:0 auto}
header{padding:8px 4px 20px}
header h1{font-size:2rem;font-weight:700;letter-spacing:0.01em}
header p{color:var(--label-2);font-size:0.875rem;margin-top:6px}

.card{background:var(--surface);border-radius:var(--radius-lg);padding:18px 16px;margin-bottom:14px}
.card h2{font-size:0.75rem;text-transform:uppercase;letter-spacing:0.05em;color:var(--label-3);margin-bottom:14px;font-weight:600}
.card h2 .count{color:var(--accent);margin-left:6px}

label{display:block;font-size:0.8125rem;color:var(--label-2);margin-bottom:7px;font-weight:500}
.field{margin-bottom:14px}
.field:last-child{margin-bottom:0}

input[type="text"],input[type="password"],input[type="number"],textarea,select{
  width:100%;background:#111113;border:1px solid transparent;border-radius:var(--radius-md);
  color:var(--label);font-size:1rem;padding:12px 14px;outline:none;font-family:inherit;
  transition:border-color .18s ease,box-shadow .18s ease,background .18s ease;
  -webkit-appearance:none;appearance:none;
}
input:focus,textarea:focus,select:focus{background:#111113;border-color:var(--accent);box-shadow:0 0 0 4px rgba(10,132,255,0.18)}
input::placeholder,textarea::placeholder{color:var(--label-3)}
textarea{min-height:64px;resize:vertical}

.btn{
  display:inline-flex;align-items:center;justify-content:center;border:none;
  border-radius:var(--radius-md);padding:13px 14px;font-size:1rem;font-weight:600;cursor:pointer;
  width:100%;min-height:48px;transition:transform .12s ease,opacity .12s ease,background .15s ease;font-family:inherit;
}
.btn:active{transform:scale(.98);opacity:.85}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:active{background:#0a6ce0}
.btn-ghost{background:transparent;border:1px solid var(--separator);color:var(--label-2)}
.btn-ghost:active{background:rgba(255,255,255,.06)}
.btn-danger{background:rgba(255,69,58,.15);color:var(--red)}
.btn-danger:active{background:rgba(255,69,58,.25)}
.btn-sm{padding:8px 12px;min-height:36px;font-size:.875rem;width:auto}

.status-pill{display:inline-flex;align-items:center;gap:6px;font-size:.8125rem;color:var(--label-2);padding:4px 12px;border-radius:999px;background:var(--surface-2);margin-right:6px;margin-bottom:6px}
.status-pill .dot{width:8px;height:8px;border-radius:50%;background:var(--green)}
.status-pill .dot.off{background:var(--label-3)}

.route{background:var(--surface-2);border-radius:var(--radius-md);padding:14px;margin-bottom:10px}
.route-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.route-name{font-weight:600;font-size:1rem}
.route-model{font-size:.8125rem;color:var(--label-2);font-variant-numeric:tabular-nums}
.route-meta{font-size:.75rem;color:var(--label-3);margin-top:4px;word-break:break-all}
.route-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{font-size:.6875rem;padding:2px 8px;border-radius:999px;background:rgba(10,132,255,.12);color:var(--accent)}
.tag.key-ok{background:rgba(48,209,88,.12);color:var(--green)}
.tag.key-miss{background:rgba(255,69,58,.12);color:var(--red)}

.row-actions{display:flex;gap:8px;margin-top:10px}
.row-actions .btn{flex:1}

.empty{color:var(--label-3);font-size:.875rem;text-align:center;padding:20px 0}
.hint{font-size:.75rem;color:var(--label-3);margin-top:8px;line-height:1.5}

/* 探测结果模型选择列表 */
.probe-list{max-height:260px;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:6px}
.probe-item{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:#111113;border:1px solid var(--separator);border-radius:var(--radius-sm);
  padding:10px 12px;cursor:pointer;transition:all .15s ease;text-align:left;width:100%;
}
.probe-item:active{background:rgba(10,132,255,.12);border-color:var(--accent)}
.probe-item .pi-id{font-size:.875rem;font-weight:500;color:var(--label);font-variant-numeric:tabular-nums;word-break:break-all}
.probe-item .pi-owner{font-size:.6875rem;color:var(--label-3);white-space:nowrap;flex-shrink:0}
.probe-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:.8125rem;color:var(--label-2)}
.probe-bar .pi-count{color:var(--accent);font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:calc(24px + var(--safe-bottom));
  background:var(--surface-2);color:var(--label);padding:12px 20px;border-radius:12px;font-size:.875rem;
  opacity:0;transition:all .25s ease;z-index:100;box-shadow:0 8px 24px rgba(0,0,0,.4);pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.error{color:var(--red)}
.toast.ok{color:var(--green)}

.login-screen{max-width:400px;margin:8vh auto 0}
.login-screen h1{font-size:1.75rem;margin-bottom:8px}
.login-screen .sub{color:var(--label-2);font-size:.875rem;margin-bottom:28px}

.hidden{display:none}
</style>
</head>
<body>
<div class="wrap">

  <!-- 登录 -->
  <div id="loginScreen" class="login-screen hidden">
    <h1>Thalamus</h1>
    <p class="sub">精简版模型路由控制台 · 管理 API Key 与路由</p>
    <div class="field">
      <label for="pwd">管理密码</label>
      <input type="password" id="pwd" placeholder="admin.pwd" autocomplete="current-password" />
    </div>
    <button class="btn btn-primary" id="loginBtn">登录</button>
    <p class="hint" style="text-align:center">登录后 token 保留 24 小时</p>
  </div>

  <!-- 主界面 -->
  <div id="mainScreen" class="hidden">
    <header>
      <h1>模型控制台</h1>
      <p id="subtitle">加载中…</p>
    </header>

    <!-- 状态 -->
    <div class="card">
      <h2>路由状态</h2>
      <div id="statusPills"></div>
    </div>

    <!-- 添加模型 -->
    <div class="card">
      <h2 id="addTitle">添加模型</h2>
      <div class="field">
        <label for="f_label">路由名 (label，英文字母，如 openai)</label>
        <input type="text" id="f_label" placeholder="openai" autocomplete="off" />
      </div>
      <div class="field">
        <label for="f_model">模型 ID</label>
        <input type="text" id="f_model" placeholder="gpt-4o" autocomplete="off" />
      </div>
      <div class="field">
        <label for="f_endpoint">API 端点 (OpenAI 兼容 /v1/chat/completions)</label>
        <input type="text" id="f_endpoint" placeholder="https://api.openai.com/v1/chat/completions" autocomplete="off" />
      </div>
      <div class="field">
        <label for="f_key">API Key（新模型必填，探测模型也需要）</label>
        <input type="password" id="f_key" placeholder="sk-..." autocomplete="off" />
      </div>
      <button class="btn btn-secondary" id="probeBtn">探测可用模型</button>
      <div id="probeResult" class="hidden" style="margin-top:10px"></div>
      <p class="hint">填好端点和 Key 后点探测，选中模型自动填入上方「模型 ID」。</p>
      <div class="field" style="margin-top:14px">
        <label for="f_provider">Provider (可选，默认=label)</label>
        <input type="text" id="f_provider" placeholder="openai" autocomplete="off" />
      </div>
      <div class="field">
        <label for="f_usage">用途描述（喂给 AI 路由做语义分类）</label>
        <textarea id="f_usage" placeholder="深度分析、逻辑推理、代码审查、长文本总结、多语言写作。关键词：分析、推理、评估、总结…"></textarea>
      </div>
      <div class="field">
        <label for="f_pattern">正则关键词（可选，留空则纯靠 AI 路由）</label>
        <input type="text" id="f_pattern" placeholder="分析|推理|评估|策略" autocomplete="off" />
      </div>
      <button class="btn btn-primary" id="addBtn">添加 / 更新模型</button>
      <p class="hint">路由策略由 AI 语义分类自动决定。添加后立即热加载生效。</p>
    </div>

    <!-- 模型列表 -->
    <div class="card">
      <h2>已配置模型 <span class="count" id="routeCount">0</span></h2>
      <div id="routeList"><div class="empty">加载中…</div></div>
    </div>

    <button class="btn btn-ghost" id="reloadBtn">重新加载配置</button>
    <button class="btn btn-ghost" id="logoutBtn" style="margin-top:8px">退出登录</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  var TOKEN = localStorage.getItem("thal_token") || "";
  var BASE = "";

  function $id(id){ return document.getElementById(id); }
  function show(el){ el.classList.remove("hidden"); }
  function hide(el){ el.classList.add("hidden"); }

  var toastTimer = null;
  function toast(msg, type){
    var t = $id("toast");
    t.textContent = msg;
    t.className = "toast show " + (type||"");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.className = "toast"; }, 2600);
  }

  function api(path, method, body){
    var opts = { method: method||"GET", headers: {} };
    if (TOKEN) opts.headers["Authorization"] = "Bearer " + TOKEN;
    if (body) { opts.headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(body); }
    return fetch(BASE + path, opts).then(function(r){
      return r.json().catch(function(){ return {error:"Invalid response"}; }).then(function(data){
        data._status = r.status;
        return data;
      });
    });
  }

  function showLogin(){
    show($id("loginScreen")); hide($id("mainScreen"));
  }
  function showMain(){
    hide($id("loginScreen")); show($id("mainScreen"));
    loadAll();
  }

  function login(){
    var pwd = $id("pwd").value;
    if(!pwd){ toast("请输入密码","error"); return; }
    api("/admin/api/login","POST",{password:pwd}).then(function(data){
      if(data.token){
        TOKEN = data.token;
        localStorage.setItem("thal_token", TOKEN);
        toast("登录成功","ok");
        showMain();
      } else {
        toast(data.error || "登录失败","error");
      }
    }).catch(function(e){ toast("请求失败","error"); });
  }

  function esc(s){
    return String(s==null?"":s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  function renderStatus(data){
    var h = "";
    var ai = data.ai_routing || {};
    h += '<span class="status-pill"><span class="dot '+(ai.enabled?"":"off")+'"></span>AI 路由 '+(ai.enabled?"ON":"OFF")+'</span>';
    h += '<span class="status-pill"><span class="dot"></span>模式 '+esc(ai.mode||"fallback")+'</span>';
    h += '<span class="status-pill"><span class="dot"></span>分类模型 '+esc(ai.model||"—")+'</span>';
    var d = data.default||{};
    h += '<span class="status-pill"><span class="dot"></span>默认 '+esc(d.model||"—")+'</span>';
    $id("statusPills").innerHTML = h;
  }

  function renderRoutes(data){
    var routes = data.routes||[];
    $id("routeCount").textContent = routes.length;
    if(!routes.length){ $id("routeList").innerHTML = '<div class="empty">暂无模型，先添加一个</div>'; return; }
    var h = "";
    routes.forEach(function(r){
      h += '<div class="route">';
      h += '<div class="route-head"><span class="route-name">'+esc(r.label)+'</span>';
      h += '<button class="btn btn-sm btn-danger" data-del="'+esc(r.label)+'">删除</button></div>';
      h += '<div class="route-model">'+esc(r.model)+'</div>';
      h += '<div class="route-meta">'+esc(r.provider)+' · '+esc(r.endpoint)+'</div>';
      h += '<div class="route-tags">';
      h += r.has_key ? '<span class="tag key-ok">Key 已配置</span>' : '<span class="tag key-miss">Key 缺失</span>';
      if(r.usage) h += '<span class="tag">'+esc(r.usage.slice(0,24))+(r.usage.length>24?"…":"")+'</span>';
      if(r.proxy) h += '<span class="tag">proxy</span>';
      h += '</div></div>';
    });
    $id("routeList").innerHTML = h;

    // 绑定删除
    document.querySelectorAll("[data-del]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var label = btn.getAttribute("data-del");
        if(!confirm("删除模型 '"+label+"'？")) return;
        api("/admin/api/routes/delete","POST",{label:label}).then(function(data){
          if(data.status==="ok"){ toast("已删除","ok"); loadAll(); }
          else toast(data.error||"删除失败","error");
        });
      });
    });
  }

  function loadAll(){
    api("/admin/api/routes/list").then(function(data){
      if(data._status===401){
        localStorage.removeItem("thal_token");
        showLogin(); toast("登录已过期，请重新登录","error");
        return;
      }
      if(data.status!=="ok"){
        $id("subtitle").textContent = "加载失败";
        toast(data.error||"加载失败","error");
        return;
      }
      $id("subtitle").textContent = "路由策略由 AI 语义分类自动决定";
      renderStatus(data);
      renderRoutes(data);
    }).catch(function(e){
      $id("subtitle").textContent = "无法连接 Thalamus";
      toast("无法连接服务","error");
    });
  }

  // 探测模型：用 endpoint+key 拉取可用模型列表
  function probeModels(){
    var endpoint = $id("f_endpoint").value.trim();
    var key = $id("f_key").value.trim();
    if(!endpoint){ toast("请先填写 API 端点","error"); $id("f_endpoint").focus(); return; }
    if(!key){ toast("请先填写 API Key","error"); $id("f_key").focus(); return; }
    var box = $id("probeResult");
    box.classList.remove("hidden");
    box.innerHTML = '<div class="probe-bar"><span>探测中…</span></div>';
    $id("probeBtn").textContent = "探测中…";
    api("/admin/api/models/probe","POST",{endpoint:endpoint,key:key}).then(function(data){
      $id("probeBtn").textContent = "探测可用模型";
      if(data.status!=="ok"){ box.innerHTML = '<p class="hint" style="color:var(--red)">'+esc(data.error||"探测失败")+'</p>'; return; }
      if(!data.models || !data.models.length){
        box.innerHTML = '<p class="hint">未探测到模型（'+(data.count||0)+'）</p>'; return;
      }
      var h = '<div class="probe-bar"><span>共 '+data.count+' 个模型</span><span class="pi-count">点选自动填入</span></div>';
      h += '<div class="probe-list">';
      data.models.forEach(function(m){
        h += '<button type="button" class="probe-item" data-mid="'+esc(m.id)+'">';
        h += '<span class="pi-id">'+esc(m.id)+'</span>';
        h += m.owned_by ? '<span class="pi-owner">'+esc(m.owned_by)+'</span>' : '';
        h += '</button>';
      });
      h += '</div>';
      box.innerHTML = h;
      // 绑定点击选中
      box.querySelectorAll(".probe-item").forEach(function(el){
        el.addEventListener("click", function(){
          $id("f_model").value = el.getAttribute("data-mid");
          $id("f_model").focus();
          toast("已填入模型 ID","ok");
          box.classList.add("hidden");
          box.innerHTML = "";
        });
      });
    }).catch(function(){ $id("probeBtn").textContent = "探测可用模型"; box.innerHTML = '<p class="hint" style="color:var(--red)">请求失败</p>'; });
  }

  function addModel(){
    var payload = {
      label: $id("f_label").value.trim(),
      model: $id("f_model").value.trim(),
      endpoint: $id("f_endpoint").value.trim(),
      provider: $id("f_provider").value.trim(),
      key: $id("f_key").value.trim(),
      usage: $id("f_usage").value.trim(),
      pattern: $id("f_pattern").value.trim()
    };
    if(!payload.label || !payload.model || !payload.endpoint){
      toast("请填写 label、模型 ID、端点","error");
      return;
    }
    api("/admin/api/routes/add","POST",payload).then(function(data){
      if(data.status==="ok"){
        toast("模型已添加","ok");
        $id("f_key").value="";
        $id("f_pattern").value="";
        loadAll();
      } else {
        toast(data.error||"添加失败","error");
      }
    }).catch(function(){ toast("请求失败","error"); });
  }

  // 事件绑定
  $id("loginBtn").addEventListener("click", login);
  $id("pwd").addEventListener("keydown", function(e){ if(e.key==="Enter") login(); });
  $id("addBtn").addEventListener("click", addModel);
  $id("probeBtn").addEventListener("click", probeModels);
  $id("reloadBtn").addEventListener("click", function(){
    api("/admin/api/reload","POST",{}).then(function(d){
      toast(d.status==="ok"?"已重新加载":"重载失败", d.status==="ok"?"ok":"error");
      loadAll();
    });
  });
  $id("logoutBtn").addEventListener("click", function(){
    localStorage.removeItem("thal_token");
    TOKEN=""; showLogin();
  });

  // 启动：有 token 尝试直接进主界面
  if(TOKEN){
    api("/admin/api/routes/list").then(function(data){
      if(data._status===401){ showLogin(); }
      else showMain();
    }).catch(function(){ showLogin(); });
  } else {
    showLogin();
  }
})();
</script>
</body>
</html>
